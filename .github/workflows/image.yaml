name: Container image

on:
  push:
    branches: [main]
    paths:
      - cmd/**
      - internal/**
      - go.mod
      - Dockerfile
      - .dockerignore
      - THIRD_PARTY_NOTICES.md
      - .github/workflows/image.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/kkato/radipod:${{ github.sha }}
            ghcr.io/kkato/radipod:latest
          labels: |
            org.opencontainers.image.source=https://github.com/kkato/radipod
          cache-from: type=gha
          cache-to: type=gha,mode=max
