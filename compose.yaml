services:
  radipod:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    ports:
      - "${RADIPOD_BIND_ADDRESS:-0.0.0.0}:${RADIPOD_PORT:-8080}:8080"
    environment:
      RADIPOD_HTTP_USER: "${RADIPOD_HTTP_USER:-}"
      RADIPOD_HTTP_PASSWORD: "${RADIPOD_HTTP_PASSWORD:-}"
    volumes:
      - type: bind
        source: ./config.local.json
        target: /app/config.json
        read_only: true
        bind:
          create_host_path: false
      - radio-data:/app/data
    read_only: true
    tmpfs:
      - /tmp

volumes:
  radio-data:
